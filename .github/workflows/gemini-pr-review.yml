name: Gemini AI Pull Request Reviewer

on:
  issue_comment:
    types: [created]

jobs:
  review:
    name: Run AI Review

    if: >
      github.event.issue.pull_request &&
      (
        startsWith(github.event.comment.body, 'review') ||
        startsWith(github.event.comment.body, 'Review') ||
        startsWith(github.event.comment.body, '/review') ||
        startsWith(github.event.comment.body, '/Review') ||
        contains(github.event.comment.body, 'review') ||
        contains(github.event.comment.body, 'Review')
      )

    runs-on: ubuntu-latest

    permissions:
      contents: read
      pull-requests: write
      issues: write

    steps:
      - name: Acknowledge & Post Instant Loading Feedback
        id: initial-feedback
        uses: actions/github-script@v7
        with:
          script: |
            try {
              await github.rest.reactions.createForIssueComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                comment_id: context.payload.comment.id,
                content: '+1'
              });
            } catch (e) {
              console.log('Failed to add reaction:', e.message);
            }

            const initialBody = `### Gemini Code Review\n\n*Running automated review pipeline...*\n\n- [x] Initializing review workflow\n- [ ] Setting up environment and fetching PR diff...\n- [ ] Loading project guidelines (\`GEMINI.md\`)\n- [ ] Evaluating code correctness and spec alignment\n- [ ] Preparing review summary`;
            
            const comment = await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              body: initialBody
            });

            core.setOutput('comment_id', comment.data.id);

      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      - name: Run Review Script
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GITHUB_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.issue.number }}
          REPOSITORY: ${{ github.repository }}
          COMMENT_ID: ${{ github.event.comment.id }}
          INITIAL_COMMENT_ID: ${{ steps.initial-feedback.outputs.comment_id }}
          GEMINI_MODEL: ${{ vars.GEMINI_MODEL || 'gemini-3.6-flash' }}
        run: node .github/scripts/review-pr.js